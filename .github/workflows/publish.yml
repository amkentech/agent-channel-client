name: Publish to npm

# Fires on a version tag pushed by scripts/release-client.mjs in the private server repo.
#
# There is no npm token anywhere in this repository or in its secrets. Publishing authenticates with GitHub's OIDC identity
# through npm trusted publishing, and --provenance attaches a signed attestation that ties the tarball on npm to this commit,
# this workflow and this runner. Anyone can check it: `npm view @amkentech/agent-channel` shows the provenance link.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for both trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      # No registry-url on purpose: it writes an .npmrc with _authToken=${NODE_AUTH_TOKEN}, and an empty token makes the
      # registry answer 404 rather than letting npm authenticate through OIDC trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm 11+ (trusted publishing needs it)
        run: npm install -g npm@latest

      - name: The package parses
        run: |
          for f in $(git ls-files '*.mjs' '*.js'); do node --check "$f" || exit 1; done

      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "::error::tag $tag != package.json $pkg"; exit 1; }

      - name: No install scripts (this runs on other people's machines)
        run: |
          node -e "const p=require('./package.json');const s=p.scripts||{};for(const k of ['preinstall','install','postinstall','prepare'])if(s[k]){console.error('::error::'+k+' script present: '+s[k]);process.exit(1)}"

      # A package that installs but contains nothing is worse than a failed publish, and .gitignore mistakes cause exactly
      # that. Build the real tarball and read what is inside it: no dependence on the shape of any npm --json output.
      - name: The tarball actually contains the client
        run: |
          tarball=$(npm pack --silent | tail -1)
          echo "packed $tarball"
          tar -tzf "$tarball" | sed 's|^package/||' | sort > /tmp/files.txt
          echo "$(wc -l < /tmp/files.txt) files:"; cat /tmp/files.txt
          for f in package.json README.md bin/agent-channel.mjs commands/inbox.md hooks/inbox.mjs lib/paths.mjs scripts/setup.mjs scripts/share.mjs; do
            grep -qx "$f" /tmp/files.txt || { echo "::error::tarball is missing $f"; exit 1; }
          done
          test "$(wc -l < /tmp/files.txt)" -ge 20 || { echo "::error::tarball has fewer than 20 files"; exit 1; }
          rm -f "$tarball"

      - name: Publish with provenance
        run: npm publish --access public --provenance
